<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kirim Laporan | SI-LAPOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0056b3; min-height: 100vh; display: flex; align-items: center; padding: 20px 0; }
        .card { border-radius: 25px; border: none; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        #successOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
        }
        .preview-img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; display: none; margin-top: 10px; border: 2px dashed #ddd; }
    </style>
</head>
<body>
    <div id="successOverlay">
        <i class="fas fa-check-circle text-success mb-4" style="font-size: 80px;"></i>
        <h2 class="fw-bold">LAPORAN TERKIRIM!</h2>
        <p class="text-muted mb-4">Laporan Anda sedang diproses oleh tim fasilitas.</p>
        <a href="index.html" class="btn btn-primary rounded-pill px-5">Ke Beranda</a>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <h3 class="fw-bold mb-4 text-primary text-center"><i class="fas fa-camera me-2"></i>Detail Kerusakan</h3>
                    <form id="laporForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nama Pelapor</label>
                            <input type="text" id="nama" class="form-control rounded-pill" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Lokasi (Gedung/Ruangan)</label>
                            <input type="text" id="lokasi" class="form-control rounded-pill" placeholder="Contoh: Gedung B Lantai 2" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Unggah Foto Bukti</label>
                            <input type="file" id="foto" class="form-control rounded-pill" accept="image/*" required>
                            <img id="preview" class="preview-img">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Deskripsi Kerusakan</label>
                            <textarea id="deskripsi" class="form-control rounded-4" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow">KIRIM LAPORAN</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let fotoBase64 = "";
        document.getElementById('foto').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('preview').style.display = 'block';
                    fotoBase64 = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('laporForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const laporan = {
                id: Date.now(),
                nama: document.getElementById('nama').value,
                lokasi: document.getElementById('lokasi').value,
                deskripsi: document.getElementById('deskripsi').value,
                foto: fotoBase64,
                tanggal: new Date().toLocaleString('id-ID')
            };
            let db = JSON.parse(localStorage.getItem('db_lapor')) || [];
            db.push(laporan);
            localStorage.setItem('db_lapor', JSON.stringify(db));
            document.getElementById('successOverlay').style.display = 'flex';
        });
    </script>
</body>
</html>
