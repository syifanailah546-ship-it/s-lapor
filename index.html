<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Internal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f4f7f6; margin: 0; overflow-x: hidden; }

        /* 1. KONTEN UTAMA (Sembunyi secara default) */
        #adminWrapper { 
            display: none; 
        }

        /* 2. AREA RAHASIA (Gembok CSS) */
        /* Kita buat kotak kecil transparan di pojok kanan bawah */
        .secret-trigger {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 50px;
            background: transparent; /* Tidak terlihat */
            z-index: 9999;
            cursor: pointer;
        }

        /* 3. LOGIKA CSS: Jika area rahasia ditekan (active), tampilkan wrapper */
        /* Di HP, ini berarti kamu harus menekan dan menahan jempol di pojok kanan bawah */
        .secret-trigger:active ~ #adminWrapper {
            display: block !important;
        }

        /* Menghilangkan pesan error saat ditekan */
        .secret-trigger:active ~ #lockScreen {
            display: none;
        }

        .sidebar { width: 260px; background: #004085; color: white; height: 100vh; position: fixed; padding: 25px; }
        .main { margin-left: 260px; padding: 40px; }
        
        /* Penyesuaian untuk HP agar tidak berantakan saat terbuka */
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main { margin-left: 0; padding: 20px; }
        }

        .img-admin { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; }
        .hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ccc; }
    </style>
</head>
<body>

    <div class="secret-trigger"></div>

    <div id="lockScreen" class="hint text-center">
        <i class="fas fa-exclamation-circle mb-2"></i>
        <p>Halaman tidak tersedia.</p>
    </div>

    <div id="adminWrapper">
        <div class="sidebar">
            <h4 class="fw-bold mb-4">ADMIN PANEL</h4>
            <nav class="nav flex-column gap-2">
                <a href="index.html" class="nav-link text-white"><i class="fas fa-home me-2"></i>Ke Beranda</a>
            </nav>
        </div>

        <div class="main">
            <h2 class="fw-bold mb-4">Monitoring Laporan</h2>
            <div class="card border-0 shadow-sm p-3">
                <table class="table align-middle">
                    <tbody id="dataBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Memanggil data tetap pakai JS agar otomatis muncul saat CSS membuka wrapper
        function muatData() {
            const data = JSON.parse(localStorage.getItem('db_lapor')) || [];
            const tbody = document.getElementById('dataBody');
            tbody.innerHTML = data.length ? "" : "<tr><td>Belum ada laporan</td></tr>";
            data.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${item.foto}" class="img-admin"></td>
                        <td><b>${item.nama}</b><br><small>${item.lokasi}</small></td>
                        <td><button onclick="hapus(${index})" class="btn btn-sm btn-success">Selesai</button></td>
                    </tr>`;
            });
        }
        window.onload = muatData;

        function hapus(i) {
            let db = JSON.parse(localStorage.getItem('db_lapor'));
            db.splice(i, 1);
            localStorage.setItem('db_lapor', JSON.stringify(db));
            muatData();
        }
    </script>
</body>
</html>
