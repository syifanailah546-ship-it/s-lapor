<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Internal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Sembunyikan seluruh konten utama secara default */
        #adminWrapper { 
            display: none; 
        }

        body { background: #f4f7f6; transition: 0.3s; }
        .sidebar { width: 260px; background: #004085; color: white; height: 100vh; position: fixed; padding: 25px; }
        .main { margin-left: 260px; padding: 40px; }
        .img-admin { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 1px solid #ddd; }
        
        /* Pesan petunjuk yang juga samar */
        .hint { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ccc; font-size: 0.8rem; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="lockScreen" class="hint">
        <p>Halaman tidak tersedia.</p>
    </div>

    <div id="adminWrapper">
        <div class="sidebar">
            <h4 class="fw-bold mb-5">SI-LAPOR ADMIN</h4>
            <nav class="nav flex-column gap-2">
                <a href="#" class="nav-link text-white bg-primary rounded"><i class="fas fa-list me-2"></i>Daftar Laporan</a>
                <a href="index.html" class="nav-link text-white-50"><i class="fas fa-home me-2"></i>Lihat Web</a>
            </nav>
        </div>

        <div class="main">
            <h2 class="fw-bold mb-4">Monitoring Laporan Kerusakan</h2>
            <div class="card border-0 shadow-sm p-4">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Foto</th>
                            <th>Pelapor</th>
                            <th>Lokasi</th>
                            <th>Deskripsi</th>
                            <th>Tanggal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Fitur Rahasia: Tekan Shift + A untuk membuka
        document.addEventListener('keydown', function(e) {
            if (e.shiftKey && e.key === 'A') {
                const wrapper = document.getElementById('adminWrapper');
                const lock = document.getElementById('lockScreen');
                
                if (wrapper.style.display === 'block') {
                    wrapper.style.display = 'none';
                    lock.style.display = 'block';
                } else {
                    wrapper.style.display = 'block';
                    lock.style.display = 'none';
                    muatData(); // Refresh data saat dibuka
                }
            }
        });

        function muatData() {
            const data = JSON.parse(localStorage.getItem('db_lapor')) || [];
            const tbody = document.getElementById('dataBody');
            tbody.innerHTML = data.length ? "" : "<tr><td colspan='6' class='text-center'>Belum ada laporan</td></tr>";
            
            data.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${item.foto}" class="img-admin" onclick="window.open(this.src)"></td>
                        <td><b>${item.nama}</b></td>
                        <td><span class="badge bg-info text-dark">${item.lokasi}</span></td>
                        <td>${item.deskripsi}</td>
                        <td class="small text-muted">${item.tanggal}</td>
                        <td><button onclick="hapus(${index})" class="btn btn-sm btn-success rounded-pill px-3">Selesai</button></td>
                    </tr>`;
            });
        }

        function hapus(i) {
            if(confirm("Hapus laporan ini?")) {
                let db = JSON.parse(localStorage.getItem('db_lapor'));
                db.splice(i, 1);
                localStorage.setItem('db_lapor', JSON.stringify(db));
                muatData();
            }
        }
    </script>
</body>
</html>
